name: PR description

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  describe:
    name: Describe the pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write the description from the OpenSpec changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/pr-description.mjs "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/pr-description.md"

      - name: Put it into the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const { readFileSync } = require("node:fs");
            const { mergeBody } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pr-description.mjs`);
            const generated = readFileSync(`${process.env.RUNNER_TEMP}/pr-description.md`, "utf8");
            const pull = { owner: context.repo.owner, repo: context.repo.repo, pull_number: context.payload.pull_request.number };
            const { data } = await github.rest.pulls.get(pull);
            const body = mergeBody(data.body, generated);
            if (body !== data.body) await github.rest.pulls.update({ ...pull, body });
