map $http_upgrade $adpulse_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name app.balagan.pro;
    client_max_body_size 25M;

    access_log /var/log/nginx/adpulse_access.log;
    error_log  /var/log/nginx/adpulse_error.log;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $adpulse_connection_upgrade;
        proxy_read_timeout 75s;
    }
}

server {
    listen 80;
    server_name bi.balagan.pro;

    # Applies only to bi.balagan.pro and its descendants. Browsers ignore HSTS
    # over HTTP; Certbot preserves it when adding the HTTPS server block.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    access_log /var/log/nginx/adpulse_landing_access.log;
    error_log  /var/log/nginx/adpulse_landing_error.log;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
