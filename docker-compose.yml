services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - adpulse_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-adpulse}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-adpulse-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - adpulse_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      storage:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-adpulse}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-adpulse-local-secret}
      S3_BUCKET: ${S3_BUCKET:-adpulse-avatars}
    entrypoint: >-
      /bin/sh -c "mc alias set local http://storage:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY
      && mc mb --ignore-existing local/$$S3_BUCKET"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      PORT: 3000
      JWT_SECRET: "${JWT_SECRET}"
      INVITE_CODE: "${INVITE_CODE}"
      INTEGRATION_ENCRYPTION_KEY: "${INTEGRATION_ENCRYPTION_KEY:-}"
      META_GRAPH_VERSION: "${META_GRAPH_VERSION:-v22.0}"
      API_DOCS: "${API_DOCS:-on}"
      S3_ENDPOINT: "http://storage:9000"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-adpulse}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-adpulse-local-secret}"
      S3_BUCKET: "${S3_BUCKET:-adpulse-avatars}"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api:/app/apps/api
      - /app/node_modules
      - /app/apps/api/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_PROXY_TARGET: "http://api:3000"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app/apps/web
      - /app/node_modules
      - /app/apps/web/node_modules

volumes:
  adpulse_pgdata:
  adpulse_minio_data:
