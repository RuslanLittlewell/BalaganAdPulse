# Included in the bi.balagan.pro server block of deploy/nginx.conf (the landing only).
# Certbot copies a server block when it adds HTTPS: check that the 443 block
# keeps this include, then verify with: curl -sI https://bi.balagan.pro/

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Report-only on purpose: enforcing a new policy blind can break the app. Read the
# violations in the browser console, then switch the header name to
# Content-Security-Policy once the policy is confirmed.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; media-src 'self' blob:; frame-src https:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self' mailto:" always;
