map $http_upgrade $adpulse_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name littlewell-app.work www.littlewell-app.work;
    client_max_body_size 25M;

    access_log /var/log/nginx/adpulse_access.log;
    error_log  /var/log/nginx/adpulse_error.log;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $adpulse_connection_upgrade;
        proxy_read_timeout 75s;
    }
}
